[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emedgene-paper-agent"
version = "0.1.0"
description = "Emedgene-style Clinical Literature NLP Extraction (GDVP), Deterministic Ontology Grounding (HGNC/HPO/MONDO), and FastMCP Agent Server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Clinical Genomics AI" }
]
keywords = [
    "bioinformatics",
    "clinical-genomics",
    "emedgene",
    "acmg",
    "hpo",
    "mondo",
    "hgvs",
    "nlp",
    "mcp",
    "explainable-ai"
]
dependencies = [
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "mcp>=1.2.0",
    "pypdf>=4.0.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
docling = [
    "docling>=2.0.0",
]

[project.scripts]
emedgene-agent = "emedgene_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
